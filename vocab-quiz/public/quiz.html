<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crescent クイズ</title>
<style>
  :root { --ink:#1d2433; --muted:#6b7280; --line:#d9dee7; --accent:#2457c5; --ok:#1a7f4b; --bad:#c62828; --bg:#f6f7fb; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 24px; min-height: 100dvh; display:flex; flex-direction:column; }
  h1 { font-size: 1.2rem; margin: 6px 0 12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; }
  button { font: inherit; }
  .btn { display:block; width:100%; margin-top:12px; padding:14px; font-size:1.1rem; font-weight:700; border:0; border-radius:12px; background:var(--accent); color:#fff; }
  .btn.sec { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .btn:disabled { opacity:.5; }
  .err { color:var(--bad); margin:8px 0; min-height:1.2em; font-weight:600; }
  .hint { color:var(--muted); font-size:.9rem; margin-top:8px; }
  /* ID picker */
  .steps { display:flex; gap:8px; margin: 4px 0 12px; }
  .steps div { flex:1; min-height:48px; border-radius:10px; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:700; background:#fff; padding:2px; text-align:center; }
  .steps div:not(.done) { color:var(--muted); font-weight:400; }
  .steps div.done { border-style:solid; border-color:var(--accent); }
  .steps div.now { border-color:var(--accent); }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; }
  .grid button { background:#fff; border:1px solid var(--line); border-radius:12px; min-height:60px; padding:4px 2px; font-size:1rem; font-weight:700; color:var(--ink); touch-action: manipulation; }
  .grid button:active { background:#eef2ff; }
  .pickhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .back { background:none; border:0; color:var(--accent); font-weight:600; padding:6px 0; }
  .confirm { display:grid; grid-template-columns: repeat(4,1fr); gap:8px; margin: 10px 0; }
  .confirm div { background:#eef2ff; border-radius:12px; padding:14px 2px; text-align:center; font-weight:700; }
  .symq { margin:14px 0 6px; font-weight:700; }
  .syms { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .syms button { background:#fff; border:1px solid var(--line); border-radius:12px; font-size:2rem; padding:8px 0; touch-action:manipulation; }
  .syms button:active { background:#eef2ff; }
  /* quiz */
  .top { display:flex; justify-content:space-between; align-items:baseline; color:var(--muted); font-size:.95rem; }
  .count { font-size: 3rem; font-weight: 800; text-align:center; font-variant-numeric: tabular-nums; line-height:1; margin: 8px 0 6px; }
  .bar { height: 10px; background:#e6e9f0; border-radius:6px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); width:100%; }
  .late .count { color:var(--bad); } .late .bar > div { background:var(--bad); }
  .sentence { font-size: 1.35rem; line-height:1.5; margin: 22px 0 8px; }
  .cue { font-size: 1.2rem; color:#374151; background:#eef2ff; border-radius:8px; padding:8px 12px; display:inline-block; }
  .answer { margin-top: 18px; font-size: 1.6rem; letter-spacing: .04em; min-height: 2.2em; border-bottom: 2px solid var(--accent); padding: 4px 2px; font-family: ui-monospace, Menlo, monospace; }
  .answer .caret { display:inline-block; width:2px; height:1.1em; background:var(--accent); vertical-align:-2px; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity:0; } }
  input.full { width:100%; margin-top:18px; font-size:1.6rem; padding:8px 4px; border:0; border-bottom:2px solid var(--accent); background:transparent; font-family: ui-monospace, Menlo, monospace; outline:none; }
  .wrong { color: var(--bad) !important; border-color: var(--bad) !important; animation: shake .35s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
  .again { color:var(--bad); font-weight:700; min-height:1.5em; margin-top:8px; }
  .kb { margin-top: auto; padding-top: 14px; user-select:none; -webkit-user-select:none; }
  .kb .row { display:flex; justify-content:center; gap:5px; margin-bottom:7px; }
  .kb button { flex: 1 1 0; max-width: 46px; height: 48px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:1.2rem; font-weight:600; color:var(--ink); touch-action: manipulation; }
  .kb button:disabled { background:#eceef3; color:#b7bcc8; border-color:#eceef3; }
  .kb button.wide { max-width: 90px; flex: 1.6 1 0; font-size:1rem; }
  .kb button.go { background:var(--accent); color:#fff; border-color:var(--accent); }
  .res { list-style:none; padding:0; margin: 12px 0 0; }
  .res li { border-top:1px solid var(--line); padding:10px 0; }
  .res .ok { color:var(--ok); font-weight:700; } .res .ng { color:var(--bad); font-weight:700; }
  .score { font-size:2.4rem; font-weight:800; text-align:center; margin: 6px 0; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<main>
  <!-- ID picker -->
  <section id="pick">
    <h1>あなたのIDを選んでください</h1>
    <div class="steps" id="steps"></div>
    <div class="err" id="pickErr"></div>
    <div class="pickhead"><b id="pickTitle"></b><button class="back" id="pickBack">← もどる</button></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="confirm" class="hidden">
    <h1>これはあなたのIDですか？</h1>
    <div class="card">
      <div class="confirm" id="confirmWords"></div>
      <div class="symq">カードの「しるし」をタップしてください</div>
      <div class="syms" id="syms"></div>
      <div class="err" id="symErr"></div>
      <button class="btn sec" id="redoBtn">ちがう（選びなおす）</button>
      <div class="err" id="joinErr"></div>
    </div>
  </section>

  <section id="ready" class="hidden">
    <h1>準備ができたら開始</h1>
    <div class="card">
      <p id="readyInfo"></p>
      <p class="hint">1問ごとに制限時間があります。英文の空所に入る単語を入力し、「次へ」で答えます。まちがえたときは、時間内なら何度でも入力しなおせます。</p>
      <button id="startBtn" class="btn">開始</button>
    </div>
  </section>

  <section id="quiz" class="hidden" style="display:flex;flex-direction:column;flex:1">
    <div class="top"><span id="pos"></span><span id="idShow"></span></div>
    <div id="timer"><div class="count" id="count">10</div><div class="bar"><div id="barFill"></div></div></div>
    <div class="sentence" id="sentence"></div>
    <div><span class="cue" id="cue"></span></div>
    <div class="answer" id="answerBox"></div>
    <input id="fullInput" class="full hidden" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
    <div class="again" id="again"></div>
    <div class="kb" id="kb"></div>
  </section>

  <section id="sending" class="hidden">
    <h1>送信中…</h1>
    <div class="card"><p id="sendMsg">回答を送信しています。</p><button id="retryBtn" class="btn hidden">もう一度送信する</button></div>
  </section>

  <section id="done" class="hidden">
    <h1>結果</h1>
    <div class="card">
      <div class="score" id="score"></div>
      <ul class="res" id="resList"></ul>
      <button class="btn" id="closeBtn">終了</button>
    </div>
  </section>

  <section id="closed" class="hidden">
    <h1>おつかれさまでした</h1>
    <div class="card"><p>このタブを閉じてください。</p></div>
  </section>
</main>
<script src="/idwords.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const LISTS = window.CRESCENT_ID_LISTS, SYMS = window.CRESCENT_SYMBOLS;
  const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
  const KEY = "crescentquiz:" + code;
  const LAST = "crescent:lastId";
  let st = load() || {};   // {identifier, token, seconds, keyboard, items, answers:{}, index, started, done}
  let timerId = null, itemStart = 0, typed = "", locked = false, checking = false, ignoreUntil = 0, tries = 0, lastChecked = "";
  let chosen = [];

  function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} }
  function show(id) { for (const s of ["pick","confirm","ready","quiz","sending","done","closed"]) $(s).classList.toggle("hidden", s !== id); }
  async function post(path, data) {
    const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || "通信エラー"), { data: j });
    return j;
  }
  async function sha256(s) {
    const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  const idText = (id) => id.split("-").join(" ");

  // ---------- start ----------
  if (!code) { show("pick"); $("pickErr").textContent = "QRコードから開いてください。"; $("grid").innerHTML = ""; }
  else if (st.done) renderDone(st.done);
  else if (st.items && st.index >= st.items.length) submit();
  else if (st.items && st.started) startQuiz(true);
  else if (st.items) showReady();
  else {
    let last = null; try { last = localStorage.getItem(LAST); } catch {}
    if (last && last.split("-").length === 4) { chosen = last.split("-"); showConfirm(); } else showPicker();
  }

  // ---------- ID picker ----------
  function showPicker(msg) {
    show("pick");
    $("pickErr").textContent = msg || "";
    renderPicker();
  }
  function renderPicker() {
    const step = chosen.length;
    const stepsEl = $("steps"); stepsEl.innerHTML = "";
    for (let i = 0; i < 4; i++) {
      const d = document.createElement("div");
      d.className = i < step ? "done" : i === step ? "now" : "";
      d.textContent = i < step ? chosen[i] : String(i + 1);
      stepsEl.appendChild(d);
    }
    $("pickTitle").textContent = `${step + 1} / 4`;
    $("pickBack").style.visibility = step ? "visible" : "hidden";
    const g = $("grid"); g.innerHTML = "";
    for (const [w] of LISTS[step].words) {
      const b = document.createElement("button");
      b.textContent = w;
      b.onclick = () => { chosen.push(w); $("pickErr").textContent = ""; if (chosen.length === 4) showConfirm(); else renderPicker(); };
      g.appendChild(b);
    }
  }
  $("pickBack").onclick = () => { chosen.pop(); renderPicker(); };

  function showConfirm() {
    show("confirm");
    $("joinErr").textContent = "";
    const c = $("confirmWords"); c.innerHTML = "";
    chosen.forEach((w) => { const d = document.createElement("div"); d.textContent = w; c.appendChild(d); });
    $("symErr").textContent = "";
    const want = window.crescentSymbolOf(chosen.join("-"));
    const box = $("syms"); box.innerHTML = "";
    SYMS.forEach(([sym, color], k) => {
      const b = document.createElement("button");
      b.innerHTML = `<span style="color:${color}">${sym}</span>`;
      b.onclick = () => (k === want ? join() : ($("symErr").textContent = "しるしが合いません。カードを見て、言葉を選びなおしてください。"));
      box.appendChild(b);
    });
  }
  $("redoBtn").onclick = () => { chosen = []; showPicker(); };
  let joining = false;
  async function join() {
    if (joining) return;
    joining = true;
    const identifier = chosen.join("-");
    try {
      const j = await post("/api/join", { code, identifier, token: st.token });
      try { localStorage.setItem(LAST, identifier); } catch {}
      st = { identifier, token: j.token, seconds: j.seconds, keyboard: j.keyboard, items: j.items, answers: st.answers || {}, index: st.index || 0 };
      save(); showReady();
    } catch (e) {
      if (e.data && e.data.submitted) { $("joinErr").textContent = e.message; }
      else { chosen = []; try { localStorage.removeItem(LAST); } catch {} showPicker(e.message); }
    }
    joining = false;
  }

  function showReady() {
    $("readyInfo").textContent = `ID: ${idText(st.identifier)} ／ ${st.items.length}問 ／ 1問 ${st.seconds}秒`;
    show("ready");
  }
  $("startBtn").onclick = () => { st.started = true; save(); startQuiz(false); };

  // ---------- quiz ----------
  function startQuiz(resumed) {
    show("quiz");
    $("idShow").textContent = idText(st.identifier);
    buildKeyboard();
    if (resumed && st.current !== undefined && st.current === st.index) {
      // Reloaded in the middle of an item: it ends with what was typed (no extra time)
      tries = st.tries || 0;
      finish(st.partial || "", false, true);
      return;
    }
    nextItem();
  }

  function buildKeyboard() {
    const kb = $("kb");
    kb.innerHTML = "";
    if (st.keyboard !== "restricted") { kb.classList.add("hidden"); $("answerBox").classList.add("hidden"); $("fullInput").classList.remove("hidden"); return; }
    for (const row of ["qwertyuiop", "asdfghjkl", "zxcvbnm"]) {
      const d = document.createElement("div"); d.className = "row";
      for (const ch of row) { const b = document.createElement("button"); b.textContent = ch; b.dataset.k = ch; b.onclick = () => key(ch); d.appendChild(b); }
      kb.appendChild(d);
    }
    const d = document.createElement("div"); d.className = "row";
    const bs = document.createElement("button"); bs.className = "wide"; bs.textContent = "⌫ 消す"; bs.onclick = () => key("BS");
    const go = document.createElement("button"); go.className = "wide go"; go.textContent = "次へ ⏎"; go.onclick = () => key("ENTER");
    d.append(bs, go); kb.appendChild(d);
  }

  const currentItem = () => st.items[st.index];

  function nextItem() {
    if (st.index >= st.items.length) { submit(); return; }
    const it = currentItem();
    locked = false; checking = false; tries = 0; lastChecked = "";
    ignoreUntil = performance.now() + 300;
    st.current = st.index; st.partial = it.first; st.tries = 0; save();
    $("pos").textContent = `${st.index + 1} / ${st.items.length}`;
    $("sentence").textContent = it.prompt;
    $("cue").textContent = it.cue;
    $("again").textContent = "";
    typed = it.first;
    if (st.keyboard === "restricted") {
      for (const b of $("kb").querySelectorAll("button[data-k]")) b.disabled = !it.letters.includes(b.dataset.k);
      renderTyped();
    } else {
      const inp = $("fullInput"); inp.value = it.first; inp.classList.remove("wrong"); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
    }
    $("answerBox").classList.remove("wrong");
    itemStart = performance.now();
    tick();
    clearInterval(timerId);
    timerId = setInterval(tick, 100);
  }

  function tick() {
    const left = st.seconds * 1000 - (performance.now() - itemStart);
    $("count").textContent = Math.max(0, Math.ceil(left / 1000));
    $("barFill").style.width = Math.max(0, (100 * left) / (st.seconds * 1000)) + "%";
    $("timer").classList.toggle("late", left <= 3000);
    if (left <= 0 && !locked) {
      const v = getTyped();
      const t = v.trim().toLowerCase();
      if (t && t !== currentItem().first.toLowerCase() && t !== lastChecked) tries++; // a new, unchecked answer left at time-up counts as a try
      finish(v, false);
    }
  }

  const getTyped = () => (st.keyboard === "restricted" ? typed : $("fullInput").value);
  function renderTyped() {
    const box = $("answerBox"); box.innerHTML = ""; box.append(document.createTextNode(typed));
    const c = document.createElement("span"); c.className = "caret"; box.append(c);
  }
  function setTypedEl(fn) { const el = st.keyboard === "restricted" ? $("answerBox") : $("fullInput"); fn(el); }

  async function check() {
    if (locked || checking || performance.now() < ignoreUntil) return;
    const it = currentItem();
    const v = getTyped().trim();
    if (v.toLowerCase() === it.first.toLowerCase() || !v) { nudge("単語を入力してください"); return; }
    checking = true;
    tries++; st.tries = tries; lastChecked = v.toLowerCase(); save();
    const ok = (await sha256(`${st.token}:${it.id}:${v.toLowerCase()}`)) === it.h;
    checking = false;
    if (locked) return; // time ran out while checking
    if (ok) finish(v, true);
    else nudge("ちがいます。もう一度！");
  }
  function nudge(msg) {
    $("again").textContent = msg;
    setTypedEl((el) => { el.classList.remove("wrong"); void el.offsetWidth; el.classList.add("wrong"); });
    if (navigator.vibrate) try { navigator.vibrate(120); } catch {}
  }
  function clearWrong() { setTypedEl((el) => el.classList.remove("wrong")); }

  function key(k) {
    if (locked || performance.now() < ignoreUntil) return;
    const it = currentItem();
    if (k === "ENTER") { check(); return; }
    clearWrong();
    if (k === "BS") { if (typed.length > 1) typed = typed.slice(0, -1); }
    else if (it.letters.includes(k) && typed.length < 30) typed += k;
    st.partial = typed; save();
    renderTyped();
  }

  $("fullInput").addEventListener("input", () => {
    const it = currentItem(), inp = $("fullInput");
    clearWrong();
    if (!inp.value.toLowerCase().startsWith(it.first.toLowerCase())) inp.value = it.first + inp.value.replace(/^\s+/, "");
    st.partial = inp.value; save();
  });
  $("fullInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); check(); } });
  document.addEventListener("keydown", (e) => {
    if (st.keyboard !== "restricted" || $("quiz").classList.contains("hidden")) return;
    if (e.key === "Enter") key("ENTER"); else if (e.key === "Backspace") key("BS"); else if (/^[a-z]$/i.test(e.key)) key(e.key.toLowerCase());
  });

  function finish(value, correct, resumed) {
    if (locked && !resumed) return;
    locked = true;
    clearInterval(timerId);
    const it = currentItem();
    st.answers[it.id] = { id: it.id, typed: value, tries, ms: resumed ? null : Math.round(performance.now() - itemStart) };
    st.index += 1; delete st.current; delete st.partial; delete st.tries;
    save();
    $("again").textContent = "";
    setTimeout(nextItem, correct ? 250 : 150);
  }

  async function submit() {
    clearInterval(timerId);
    show("sending");
    $("retryBtn").classList.add("hidden");
    $("sendMsg").textContent = "回答を送信しています。";
    try {
      const j = await post("/api/submit", { token: st.token, answers: Object.values(st.answers) });
      st.done = j; save(); renderDone(j);
    } catch (e) {
      if (e.message.includes("提出済み")) { show("closed"); return; }
      $("sendMsg").textContent = "送信できませんでした（" + e.message + "）。回答はこの端末に保存されています。";
      $("retryBtn").classList.remove("hidden");
    }
  }
  $("retryBtn").onclick = submit;

  function renderDone(j) {
    show("done");
    $("score").textContent = `${j.score} / ${j.total}`;
    const ul = $("resList"); ul.innerHTML = "";
    for (const f of j.feedback) {
      const li = document.createElement("li");
      const mark = document.createElement("span"); mark.className = f.correct ? "ok" : "ng"; mark.textContent = f.correct ? "○ " : "× ";
      const s = document.createElement("div"); s.append(mark, document.createTextNode(f.sentence.replace("___", f.answer)));
      const d = document.createElement("div"); d.className = "hint";
      d.textContent = `${f.cue}　正解: ${f.answer}` + (f.correct ? "" : `　あなたの答え: ${f.typed || "（空欄）"}`);
      li.append(s, d); ul.appendChild(li);
    }
  }

  // 終了: try to close the tab; if the browser does not allow it, clear the results and ask the student to close it
  $("closeBtn").onclick = () => {
    try { localStorage.removeItem(KEY); } catch {}
    st = {};
    $("resList").innerHTML = ""; $("score").textContent = "";
    try { window.close(); } catch {}
    setTimeout(() => { show("closed"); try { history.replaceState(null, "", "/"); } catch {} }, 250);
  };
})();
</script>
</body>
</html>
