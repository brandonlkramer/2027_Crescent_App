<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>単語クイズ</title>
<style>
  :root { --ink:#1d2433; --muted:#6b7280; --line:#d9dee7; --accent:#2457c5; --ok:#1a7f4b; --bad:#c62828; --bg:#f6f7fb; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 24px; min-height: 100dvh; display:flex; flex-direction:column; }
  h1 { font-size: 1.25rem; margin: 8px 0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input.text { width:100%; font-size:1.15rem; padding:12px; border:1px solid var(--line); border-radius:10px; }
  button { font: inherit; }
  .btn { display:block; width:100%; margin-top:14px; padding:14px; font-size:1.1rem; font-weight:700; border:0; border-radius:12px; background:var(--accent); color:#fff; }
  .btn:disabled { opacity:.5; }
  .err { color:var(--bad); margin-top:10px; min-height:1.2em; }
  .hint { color:var(--muted); font-size:.9rem; margin-top:8px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; color:var(--muted); font-size:.95rem; }
  .count { font-size: 3rem; font-weight: 800; text-align:center; font-variant-numeric: tabular-nums; line-height:1; margin: 8px 0 6px; }
  .bar { height: 10px; background:#e6e9f0; border-radius:6px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); width:100%; }
  .late .count { color:var(--bad); } .late .bar > div { background:var(--bad); }
  .sentence { font-size: 1.35rem; line-height:1.5; margin: 22px 0 8px; }
  .cue { font-size: 1.2rem; color:#374151; background:#eef2ff; border-radius:8px; padding:8px 12px; display:inline-block; }
  .answer { margin-top: 18px; font-size: 1.6rem; letter-spacing: .04em; min-height: 2.2em; border-bottom: 2px solid var(--accent); padding: 4px 2px; font-family: ui-monospace, Menlo, monospace; }
  .answer .caret { display:inline-block; width:2px; height:1.1em; background:var(--accent); vertical-align:-2px; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity:0; } }
  input.full { width:100%; margin-top:18px; font-size:1.6rem; padding:8px 4px; border:0; border-bottom:2px solid var(--accent); background:transparent; font-family: ui-monospace, Menlo, monospace; outline:none; }
  .kb { margin-top: auto; padding-top: 14px; user-select:none; -webkit-user-select:none; }
  .kb .row { display:flex; justify-content:center; gap:5px; margin-bottom:7px; }
  .kb button { flex: 1 1 0; max-width: 46px; height: 48px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:1.2rem; font-weight:600; color:var(--ink); touch-action: manipulation; }
  .kb button:disabled { background:#eceef3; color:#b7bcc8; border-color:#eceef3; }
  .kb button.wide { max-width: 90px; flex: 1.6 1 0; font-size:1rem; }
  .kb button.go { background:var(--accent); color:#fff; border-color:var(--accent); }
  .res { list-style:none; padding:0; margin: 12px 0 0; }
  .res li { border-top:1px solid var(--line); padding:10px 0; }
  .res .ok { color:var(--ok); font-weight:700; } .res .ng { color:var(--bad); font-weight:700; }
  .score { font-size:2.4rem; font-weight:800; text-align:center; margin: 6px 0; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<main>
  <section id="join">
    <h1>単語クイズ</h1>
    <div class="card">
      <label for="ident">あなたのID（英単語4つ）</label>
      <input id="ident" class="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例: river green table music">
      <div class="hint">スペースで区切って入力してください。</div>
      <button id="joinBtn" class="btn">はじめる</button>
      <div id="joinErr" class="err"></div>
    </div>
  </section>

  <section id="ready" class="hidden">
    <h1>準備ができたら開始</h1>
    <div class="card">
      <p id="readyInfo"></p>
      <p class="hint">1問ごとに制限時間があります。英文の空所に入る単語を入力し、Enter（次へ）で進みます。答えは最後に表示されます。</p>
      <button id="startBtn" class="btn">開始</button>
    </div>
  </section>

  <section id="quiz" class="hidden" style="display:flex;flex-direction:column;flex:1">
    <div class="top"><span id="pos"></span><span id="idShow"></span></div>
    <div id="timer"><div class="count" id="count">10</div><div class="bar"><div id="barFill"></div></div></div>
    <div class="sentence" id="sentence"></div>
    <div><span class="cue" id="cue"></span></div>
    <div class="answer" id="answerBox"></div>
    <input id="fullInput" class="full hidden" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
    <div class="kb" id="kb"></div>
  </section>

  <section id="sending" class="hidden">
    <h1>送信中…</h1>
    <div class="card"><p id="sendMsg">回答を送信しています。</p><button id="retryBtn" class="btn hidden">もう一度送信する</button></div>
  </section>

  <section id="done" class="hidden">
    <h1>結果</h1>
    <div class="card">
      <div class="score" id="score"></div>
      <ul class="res" id="resList"></ul>
    </div>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
  const KEY = "vocabquiz:" + code;
  let st = load() || {};   // {identifier, token, seconds, keyboard, items, answers:{}, index}
  let timerId = null, itemStart = 0, typed = "", locked = false, ignoreUntil = 0;

  function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} }
  function show(id) { for (const s of ["join","ready","quiz","sending","done"]) $(s).classList.toggle("hidden", s !== id); }
  async function post(path, data) {
    const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || "通信エラー"), { data: j });
    return j;
  }

  if (!code) { $("joinErr").textContent = "QRコードから開いてください。"; $("joinBtn").disabled = true; }
  if (st.identifier) $("ident").value = st.identifier.replace(/-/g, " ");
  if (st.done) renderDone(st.done);
  else if (st.items && st.index !== undefined && st.index >= st.items.length) submit();
  else if (st.items && st.started) { startQuiz(true); }
  else if (st.items) showReady();
  else show("join");

  $("joinBtn").onclick = async () => {
    $("joinErr").textContent = "";
    $("joinBtn").disabled = true;
    try {
      const j = await post("/api/join", { code, identifier: $("ident").value, token: st.token });
      st = { identifier: $("ident").value.trim().toLowerCase().replace(/\s+/g, "-"), token: j.token, seconds: j.seconds, keyboard: j.keyboard, items: j.items, answers: st.answers || {}, index: st.index || 0 };
      save(); showReady();
    } catch (e) { $("joinErr").textContent = e.message; }
    $("joinBtn").disabled = false;
  };
  $("ident").addEventListener("keydown", (e) => { if (e.key === "Enter") $("joinBtn").click(); });

  function showReady() {
    $("readyInfo").textContent = `ID: ${st.identifier.replace(/-/g, " ")} ／ ${st.items.length}問 ／ 1問 ${st.seconds}秒`;
    show("ready");
  }
  $("startBtn").onclick = () => { st.started = true; save(); startQuiz(false); };

  function startQuiz(resumed) {
    show("quiz");
    $("idShow").textContent = st.identifier.replace(/-/g, " ");
    buildKeyboard();
    if (resumed && st.current !== undefined && st.current === st.index) {
      // Reloaded in the middle of an item: it counts as answered with what was typed (no extra time)
      record(st.partial || "");
      return;
    }
    nextItem();
  }

  function buildKeyboard() {
    const kb = $("kb");
    kb.innerHTML = "";
    if (st.keyboard !== "restricted") { kb.classList.add("hidden"); $("answerBox").classList.add("hidden"); $("fullInput").classList.remove("hidden"); return; }
    for (const row of ["qwertyuiop", "asdfghjkl", "zxcvbnm"]) {
      const d = document.createElement("div"); d.className = "row";
      for (const ch of row) { const b = document.createElement("button"); b.textContent = ch; b.dataset.k = ch; b.onclick = () => key(ch); d.appendChild(b); }
      kb.appendChild(d);
    }
    const d = document.createElement("div"); d.className = "row";
    const bs = document.createElement("button"); bs.className = "wide"; bs.textContent = "⌫ 消す"; bs.onclick = () => key("BS");
    const go = document.createElement("button"); go.className = "wide go"; go.textContent = "次へ ⏎"; go.onclick = () => key("ENTER");
    d.append(bs, go); kb.appendChild(d);
  }

  function currentItem() { return st.items[st.index]; }

  function nextItem() {
    if (st.index >= st.items.length) { submit(); return; }
    const it = currentItem();
    locked = false;
    ignoreUntil = performance.now() + 300;
    st.current = st.index; st.partial = it.first; save();
    $("pos").textContent = `${st.index + 1} / ${st.items.length}`;
    $("sentence").textContent = it.prompt;
    $("cue").textContent = it.cue;
    typed = it.first;
    if (st.keyboard === "restricted") {
      for (const b of $("kb").querySelectorAll("button[data-k]")) b.disabled = !it.letters.includes(b.dataset.k);
      renderTyped();
    } else {
      const inp = $("fullInput"); inp.value = it.first; inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
    }
    itemStart = performance.now();
    tick();
    clearInterval(timerId);
    timerId = setInterval(tick, 100);
  }

  function tick() {
    const left = st.seconds * 1000 - (performance.now() - itemStart);
    const secs = Math.max(0, Math.ceil(left / 1000));
    $("count").textContent = secs;
    $("barFill").style.width = Math.max(0, (100 * left) / (st.seconds * 1000)) + "%";
    $("timer").classList.toggle("late", left <= 3000);
    if (left <= 0) record(getTyped());
  }

  function getTyped() { return st.keyboard === "restricted" ? typed : $("fullInput").value; }
  function renderTyped() { $("answerBox").innerHTML = ""; $("answerBox").append(document.createTextNode(typed)); const c = document.createElement("span"); c.className = "caret"; $("answerBox").append(c); }

  function key(k) {
    if (locked || performance.now() < ignoreUntil) return;
    const it = currentItem();
    if (k === "ENTER") { record(typed); return; }
    if (k === "BS") { if (typed.length > 1) typed = typed.slice(0, -1); }
    else if (it.letters.includes(k) && typed.length < 30) typed += k;
    st.partial = typed; save();
    renderTyped();
  }

  $("fullInput").addEventListener("input", () => {
    const it = currentItem(), inp = $("fullInput");
    if (!inp.value.toLowerCase().startsWith(it.first.toLowerCase())) inp.value = it.first + inp.value.replace(/^\s+/, "");
    st.partial = inp.value; save();
  });
  $("fullInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); if (!locked && performance.now() >= ignoreUntil) record($("fullInput").value); } });
  document.addEventListener("keydown", (e) => {
    if (st.keyboard !== "restricted" || $("quiz").classList.contains("hidden")) return;
    if (e.key === "Enter") key("ENTER"); else if (e.key === "Backspace") key("BS"); else if (/^[a-z]$/i.test(e.key)) key(e.key.toLowerCase());
  });

  function record(value) {
    if (locked) return;
    locked = true;
    clearInterval(timerId);
    const it = currentItem();
    st.answers[it.id] = { id: it.id, typed: value, ms: Math.round(performance.now() - itemStart) };
    st.index += 1; delete st.current; delete st.partial;
    save();
    setTimeout(nextItem, 150);
  }

  async function submit() {
    clearInterval(timerId);
    show("sending");
    $("retryBtn").classList.add("hidden");
    $("sendMsg").textContent = "回答を送信しています。";
    try {
      const j = await post("/api/submit", { token: st.token, answers: Object.values(st.answers) });
      st.done = j; save(); renderDone(j);
    } catch (e) {
      $("sendMsg").textContent = "送信できませんでした（" + e.message + "）。回答はこの端末に保存されています。";
      $("retryBtn").classList.remove("hidden");
    }
  }
  $("retryBtn").onclick = submit;

  function renderDone(j) {
    show("done");
    $("score").textContent = `${j.score} / ${j.total}`;
    const ul = $("resList"); ul.innerHTML = "";
    for (const f of j.feedback) {
      const li = document.createElement("li");
      const mark = document.createElement("span"); mark.className = f.correct ? "ok" : "ng"; mark.textContent = f.correct ? "○ " : "× ";
      const s = document.createElement("div"); s.append(mark, document.createTextNode(f.sentence.replace("___", f.answer)));
      const d = document.createElement("div"); d.className = "hint";
      d.textContent = `${f.cue}　正解: ${f.answer}` + (f.correct ? "" : `　あなたの答え: ${f.typed || "（空欄）"}`);
      li.append(s, d); ul.appendChild(li);
    }
  }
})();
</script>
</body>
</html>
