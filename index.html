<!DOCTYPE html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crescent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2450a8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-22 -22 44 44'%3E%3Ccircle r='20' fill='%23eef1f6' stroke='%23b5472b' stroke-width='2'/%3E%3Cpath d='M0,-20 A20,20 0 0 1 0,20 A13,20 0 0 0 0,-20Z' fill='%23f5c518'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: single phone-first column; each question sits on an index card with a red margin rule; keyboard docks below the card in quizzes.
   Brand: Crescent. The header moon waxes from a thin crescent to a full moon as the student learns the meanings in the selected set. */
:root {
  --paper: #f3f6fa;
  --surface: #ffffff;
  --ink: #16233b;
  --muted: #586580;
  --line: #d7dfea;
  --accent: #2450a8;
  --accent-soft: #e5ecf9;
  --rule: #e2a7a2;
  --ok: #1d7448;
  --ok-soft: #e1f2e8;
  --bad: #b0352b;
  --bad-soft: #fbe8e5;
  --key: #e9eef5;
  --moon: #f5c518;       /* crescent yellow */
  --moon-dark: #eef1f6;  /* unlit part of the moon */
  --roof: #b5472b;       /* highlight: campus roof-tile red */
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --font-ja: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1421; --surface: #172034; --ink: #e8edf6; --muted: #9ba7be; --line: #2a3651;
    --accent: #93b2f6; --accent-soft: #1d2b4b; --rule: #6a3633; --ok: #6fd29d; --ok-soft: #15352a;
    --bad: #ff8d81; --bad-soft: #3b1e1c; --key: #222d45; color-scheme: dark;
    --moon: #ffd23f; --moon-dark: #222d45; --roof: #e0704f;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1421; --surface: #172034; --ink: #e8edf6; --muted: #9ba7be; --line: #2a3651;
  --accent: #93b2f6; --accent-soft: #1d2b4b; --rule: #6a3633; --ok: #6fd29d; --ok-soft: #15352a;
  --bad: #ff8d81; --bad-soft: #3b1e1c; --key: #222d45; color-scheme: dark;
  --moon: #ffd23f; --moon-dark: #222d45; --roof: #e0704f;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand-name { display: flex; align-items: center; gap: 12px; }
.moon { width: 44px; height: 44px; flex: none; display: block; }
.moon .disk { fill: var(--moon-dark); stroke: var(--roof); stroke-width: 1.5; }
.moon .lit { fill: var(--moon); }
.moon.full .disk { stroke-width: 2.5; }
.moon.full .lit { filter: drop-shadow(0 0 3px var(--roof)); }
.brand-text { display: flex; flex-direction: column; gap: 1px; }
h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; line-height: 1.1; }
.moon-caption { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--key); border-radius: 999px; padding: 4px; gap: 4px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 700 0.95rem var(--font-body); padding: 9px 10px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.sets { display: flex; flex-direction: column; gap: 10px; }
.set-option { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
.set-option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.set-option input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; flex: none; }
.set-option strong { display: block; }
.btn { border: 0; border-radius: 12px; padding: 13px 18px; font: 700 1rem var(--font-body); cursor: pointer; background: var(--accent); color: var(--surface); }
.btn.secondary { background: var(--key); color: var(--ink); }
.btn:focus-visible, .tabs button:focus-visible, .key:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 160px; }
.meta { display: flex; justify-content: space-between; font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--key); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
.timer { height: 14px; }
.timer i { background: var(--accent); transition: none; }
.timer-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.clock { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.clock small { font-size: 0.9rem; color: var(--muted); margin-left: 3px; }
.clock.low { color: var(--bad); }
.timer.low i { background: var(--bad); }
.timer.paused i { opacity: 0.3; }
.clock.paused { color: var(--muted); font-size: 1rem; font-family: var(--font-body); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 18px 18px; box-shadow: 0 2px 10px rgba(22,35,59,.06); display: flex; flex-direction: column; gap: 14px; }
.card::before { content: ""; display: block; height: 22px; border-bottom: 2px solid var(--rule); margin: 0 -18px; }
.recycle { font-size: 0.8rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.sentence { font-size: 1.35rem; line-height: 1.6; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2.5px solid var(--ink); margin: 0 2px; }
.blank .hint { font-weight: 700; color: var(--accent); padding-left: 2px; }
.fill-ok { color: var(--ok); font-weight: 700; border-bottom: 2.5px solid var(--ok); }
.fill-bad { color: var(--bad); font-weight: 700; border-bottom: 2.5px solid var(--bad); }
.cue { display: flex; align-items: baseline; gap: 10px; }
.cue-label { font-family: var(--font-ja); font-size: 0.75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.cue-text { font-family: var(--font-ja); font-weight: 700; font-size: 1.3rem; color: var(--accent); }
.answer-form { display: flex; gap: 8px; }
.answer-form input, .field input, .field select {
  flex: 1; min-width: 0; font: 1.15rem var(--font-body); padding: 12px 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
}
.answer-form input[readonly] { opacity: .7; }
.feedback { border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.feedback.bad { background: var(--bad-soft); }
.feedback.bad .verdict { color: var(--bad); font-weight: 700; }
.feedback .full { color: var(--ink); font-size: 1.05rem; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 420px) { .fields { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field legend { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.field input, .field select { font-size: 1rem; padding: 10px 12px; background: var(--surface); }
fieldset.field { border: 0; padding: 0; margin: 0; }
.radios { display: flex; flex-direction: column; gap: 8px; }
.summary-box { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 0.95rem; }
.summary-box .warn { color: var(--bad); display: block; margin-top: 4px; }
.idchip { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; }
.answer-display { min-height: 52px; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 1.3rem; letter-spacing: .04em; background: var(--paper); display: flex; align-items: center; }
.answer-display .caret { display: inline-block; width: 2px; height: 1.3em; background: var(--accent); margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.kbd { display: flex; flex-direction: column; gap: 6px; user-select: none; -webkit-user-select: none; }
.kbd-row { display: flex; gap: 5px; justify-content: center; }
.key { flex: 1 1 0; max-width: 46px; height: 46px; border: 0; border-radius: 8px; background: var(--surface); color: var(--ink); font: 700 1.1rem var(--font-body); box-shadow: 0 1px 0 var(--line); cursor: pointer; touch-action: manipulation; }
.key:active { background: var(--accent-soft); }
.key:disabled { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: transparent; cursor: default; }
.key.wide { max-width: 120px; flex: 2 1 0; font-size: 0.95rem; }
.kbd-wrap { background: var(--key); border-radius: var(--radius); padding: 10px 6px; }
.score { font-family: var(--font-display); font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.review { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.review li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.review .mark { font-weight: 700; font-size: 0.85rem; }
.review .mark.ok { color: var(--ok); }
.review .mark.bad { color: var(--bad); }
textarea { width: 100%; min-height: 150px; font: 0.78rem ui-monospace, Menlo, Consolas, monospace; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; }
footer { font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } .answer-display .caret { animation: none; } }
/* ---------- Home screen (week list), dialogs, settings, practice quiz retry ---------- */
.brand-side { display: flex; align-items: center; gap: 10px; }
.btn.pill { padding: 7px 14px; font-size: 0.85rem; border-radius: 999px; }
.weeks { display: flex; flex-direction: column; gap: 10px; }
.wk { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; gap: 12px; align-items: center; }
.wk.current { border-color: var(--roof); }
.wk.later { opacity: 0.62; }
.wk .info { flex: 1; min-width: 0; display: flex; gap: 10px; align-items: center; }
.wk .moon { width: 40px; height: 40px; }
.wk .title { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.badge { font-family: var(--font-ja); font-size: 0.7rem; font-weight: 700; color: #fff; background: var(--roof); border-radius: 999px; padding: 1px 8px; }
.badge.miss { background: var(--bad-soft); color: var(--bad); }
.badge.later { background: var(--key); color: var(--muted); }
.badge.free { background: var(--key); color: var(--ink); font-size: 0.75rem; padding: 2px 10px; align-self: flex-start; }
.radios.inline { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wk .btns { display: flex; flex-direction: column; gap: 6px; flex: 0 0 130px; }
.wk .btns .btn { padding: 9px 10px; font-size: 0.9rem; line-height: 1.25; }
.btn small { display: block; font-weight: 400; font-size: 0.75rem; opacity: 0.85; }
@media (min-width: 540px) { .wk .btns { flex-direction: row; flex-basis: auto; } .wk .btns .btn { width: 134px; } }
.overlay { position: fixed; inset: 0; background: rgba(14, 20, 33, 0.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
.overlay[hidden] { display: none; }
.dialog { background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 20px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.dialog h2 { font-size: 1.15rem; }
.answer-display.wrong, .answer-form input.wrong { border-color: var(--bad); color: var(--bad); animation: shake 0.35s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.retry-msg { color: var(--bad); font-weight: 700; min-height: 1.5em; font-family: var(--font-ja); }
.dialog .set-option { text-transform: none; letter-spacing: 0; font-size: 1rem; font-weight: 400; color: var(--ink); }
.dialog .set-option .muted { display: block; font-weight: 400; margin-top: 2px; }
.dialog .set-option input { flex: none; width: 18px; min-width: 18px; height: 18px; padding: 0; border: 0; }
.week-moon-row { display: flex; align-items: center; gap: 12px; }
.week-moon-row .moon { width: 56px; height: 56px; }
@media (prefers-reduced-motion: reduce) { .answer-display.wrong, .answer-form input.wrong { animation: none; } }
</style>

<div class="app">
  <header>
    <div class="brand">
      <div class="brand-name">
        <svg class="moon" id="moon" viewBox="-22 -22 44 44" role="img" aria-labelledby="moon-caption">
          <circle class="disk" r="20"></circle>
          <path class="lit" id="moon-lit" d=""></path>
        </svg>
        <div class="brand-text">
          <h1>Crescent</h1>
          <span class="moon-caption" id="moon-caption"></span>
        </div>
      </div>
      <div class="brand-side">
        <span class="tag" data-t="tag"></span>
        <button class="btn secondary pill" id="open-settings" type="button" data-t="settings"></button>
      </div>
    </div>
  </header>

  <main>
    <!-- HOME: week list -->
    <section id="view-home" class="stack">
      <h2 data-t="homeTitle"></h2>
      <p class="muted small" data-t="homeNote"></p>
      <div class="weeks" id="weeks"></div>
      <p class="muted small" id="demo-note" hidden></p>
    </section>

    <!-- PRACTICE -->
    <section id="view-practice" hidden>
      <div id="p-run" class="stack">
        <span class="badge free" id="p-free" data-t="freeLabel" hidden></span>
        <div class="meta"><span id="p-count"></span><span id="p-week"></span></div>
        <div class="bar"><i id="p-bar"></i></div>
        <div class="timer-row"><span class="meta" data-t="timeLeft"></span><span class="clock" id="p-clock"></span></div>
        <div class="bar timer" id="p-timerbar" role="progressbar"><i id="p-timer"></i></div>
        <article class="card">
          <span class="recycle" id="p-recycle" data-t="again" hidden></span>
          <p class="sentence" id="p-sentence"></p>
          <p class="cue"><span class="cue-label">意味</span><span class="cue-text" id="p-cue" lang="ja"></span></p>
          <form class="answer-form" id="p-form">
            <label for="p-input" class="sr">Answer</label>
            <input id="p-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
            <button class="btn" id="p-check" type="submit"></button>
          </form>
          <div class="feedback" id="p-feedback" hidden aria-live="polite"></div>
        </article>
        <button class="btn secondary" id="p-quit" type="button" data-t="endSession"></button>
      </div>

      <div id="p-empty" class="stack" hidden>
        <h2 data-t="allDoneTitle"></h2>
        <p class="muted" data-t="allDoneBody"></p>
        <div class="row">
          <button class="btn" id="p-empty-quiz" type="button" data-t="pquiz"></button>
          <button class="btn secondary" id="p-empty-free" type="button" data-t="freeBtn"></button>
          <button class="btn secondary" id="p-empty-home" type="button" data-t="home"></button>
        </div>
      </div>

      <div id="p-done" class="stack" hidden>
        <h2 data-t="sessionDone"></h2>
        <p class="score" id="p-score"></p>
        <p class="muted" id="p-score-note"></p>
        <div class="week-moon-row" id="p-weekmoon"></div>
        <div class="row">
          <button class="btn" id="p-more" type="button" data-t="oneMore"></button>
          <button class="btn secondary" id="p-home" type="button" data-t="home"></button>
        </div>
      </div>
    </section>

    <!-- PRACTICE QUIZ -->
    <section id="view-pquiz" hidden>
      <div id="q-run" class="stack">
        <div class="timer-row"><span class="meta" id="q-count"></span><span class="clock" id="q-clock"></span></div>
        <div class="bar timer" id="q-timerbar" role="progressbar"><i id="q-timer"></i></div>
        <article class="card">
          <p class="sentence" id="q-sentence"></p>
          <p class="cue"><span class="cue-label">意味</span><span class="cue-text" id="q-cue" lang="ja"></span></p>
          <div class="answer-display" id="q-display" aria-live="polite"></div>
          <p class="retry-msg" id="q-retry" aria-live="assertive"></p>
        </article>
        <div class="kbd-wrap" id="q-kbd-wrap"><div class="kbd" id="q-kbd"></div></div>
        <button class="btn" id="q-next" type="button"></button>
      </div>

      <div id="q-done" class="stack" hidden>
        <h2 data-t="qResults"></h2>
        <p class="score" id="q-score"></p>
        <p class="muted small" id="q-score-note"></p>
        <ul class="review" id="q-review-list"></ul>
        <div class="row"><button class="btn" id="q-home" type="button" data-t="home"></button></div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>
</div>

<!-- Later-week advice (shown once per week) -->
<div class="overlay" id="later-dialog" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="later-title">
    <h2 id="later-title" data-t="laterTitle"></h2>
    <p data-t="laterBody"></p>
    <div class="row">
      <button class="btn" id="later-go" type="button" data-t="goAhead"></button>
      <button class="btn secondary" id="later-back" type="button" data-t="goBack"></button>
    </div>
  </div>
</div>

<!-- Free review confirmation -->
<div class="overlay" id="free-dialog" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="free-title">
    <h2 id="free-title" data-t="freeTitle"></h2>
    <p data-t="freeBody"></p>
    <div class="row">
      <button class="btn" id="free-go" type="button" data-t="freeGo"></button>
      <button class="btn secondary" id="free-back" type="button" data-t="freeBack"></button>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="overlay" id="settings-dialog" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title" data-t="settings"></h2>
    <fieldset class="field">
      <legend data-t="language"></legend>
      <div class="radios">
        <label class="set-option"><input type="radio" name="lang" value="ja"><span><strong>日本語</strong></span></label>
        <label class="set-option"><input type="radio" name="lang" value="en"><span><strong>English</strong></span></label>
      </div>
    </fieldset>
    <fieldset class="field">
      <legend data-t="timeSetting"></legend>
      <div class="radios inline">
        <label class="set-option"><input type="radio" name="secs" value="10"><span><strong data-t="s10"></strong></span></label>
        <label class="set-option"><input type="radio" name="secs" value="15"><span><strong data-t="s15"></strong></span></label>
        <label class="set-option"><input type="radio" name="secs" value="20"><span><strong data-t="s20"></strong></span></label>
        <label class="set-option"><input type="radio" name="secs" value="30"><span><strong data-t="s30"></strong></span></label>
      </div>
      <p class="muted small" data-t="timeNote"></p>
    </fieldset>
    <fieldset class="field">
      <legend data-t="reviewSetting"></legend>
      <label class="set-option"><input type="checkbox" id="skip-known"><span><strong data-t="skipKnown"></strong><span class="muted small" data-t="skipKnownNote"></span></span></label>
    </fieldset>
    <button class="btn" id="settings-close" type="button" data-t="close"></button>
  </div>
</div>
<script>
/* ---------- Sample item bank (schema v1) ---------- */
const WORDS_PER_WEEK = 50;

/* ---------- Helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => s.trim().toLowerCase().replace(/[‘’]/g, "'");
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
/* The first letter of the answer is shown in the blank and pre-typed in the answer box. */
const SHOW_FIRST_LETTER = true;
const hintOf = (a) => SHOW_FIRST_LETTER ? a.charAt(0).toLowerCase() : "";
function sentenceHTML(s, fill, cls, hint) {
  const parts = s.split("___");
  let mid;
  if (fill == null) {
    let h = hint || "";
    if (h && !parts[0].trim()) h = h.toUpperCase();
    mid = `<span class="blank" aria-label="blank${h ? ", starts with " + esc(h) : ""}">${h ? '<span class="hint">' + esc(h) + '</span>' : "&nbsp;"}</span>`;
  } else {
    mid = `<span class="${cls}">${esc(fill)}</span>`;
  }
  return esc(parts[0]) + mid + esc(parts[1] || "");
}

/* ---------- Weeks and schedule ---------- */
const WEEKS = [];
for (let w = 1; (w - 1) * WPW < BANK.length; w++) {
  const heads = BANK.slice((w - 1) * WPW, w * WPW);
  WEEKS.push({ n: w, heads, senses: heads.flatMap((h) => h.senses.map((s) => s.id)), range: `${heads[0].rank}–${heads[heads.length - 1].rank}` });
}
function currentWeek() {
  if (DEMO) return 1;
  const start = new Date(SCHEDULE_START + "T00:00:00"), now = new Date(todayStr() + "T00:00:00");
  const days = Math.floor((now - start) / 86400000);
  return Math.max(1, Math.min(WEEKS.length, days < 0 ? 1 : Math.floor(days / 7) + 1));
}

/* ---------- Progress: levels 0–5 per meaning (kept on this device only) ----------
   Correct: up one level, at most once per day. Miss: down one level (at most once per session).
   Learned = level 3 or higher. A practice-quiz answer counts the same as a practice answer. */
const prog = (() => {
  try { const p = JSON.parse(store.get("crescent.progress.v2") || "null"); if (p) return p; } catch (e) {}
  const p = {};
  try { JSON.parse(store.get("crescent.learned") || "[]").forEach((id) => { p[id] = { lv: 1, up: "", miss: false }; }); } catch (e) {}
  return p;
})();
const saveProg = () => store.set("crescent.progress.v2", JSON.stringify(prog));
const rec = (id) => prog[id] || (prog[id] = { lv: 0, up: "", miss: false });
const level = (id) => (prog[id] ? prog[id].lv : 0);
const isLearned = (id) => level(id) >= LEARNED_LEVEL;
/* Known list: a correct first-ever answer in practice (full keyboard, no letter hints) marks the meaning as known:
   it counts as learned (level 3) and is skipped in practice while the setting is on. A first sighting in a practice quiz
   does not count. A known meaning that is later missed leaves the list and returns to level 2. */
const isKnown = (id) => !!(prog[id] && prog[id].known);
function markKnown(id) { prog[id] = { lv: LEARNED_LEVEL, up: todayStr(), miss: false, known: true }; saveProg(); }
function applyResult(id, ok, dropped) {
  const r = rec(id);
  if (!ok && r.known) { r.known = false; r.miss = true; r.lv = LEARNED_LEVEL - 1; if (dropped) dropped.add(id); saveProg(); return; }
  if (ok) {
    r.miss = false;
    if (r.lv < MAX_LEVEL && r.up !== todayStr()) { r.lv++; r.up = todayStr(); }
  } else {
    r.miss = true;
    if (!dropped || !dropped.has(id)) { r.lv = Math.max(0, r.lv - 1); if (dropped) dropped.add(id); }
  }
  saveProg();
}
const weekStats = (wk) => ({ learned: wk.senses.filter(isLearned).length, total: wk.senses.length, missed: wk.senses.filter((id) => prog[id] && prog[id].miss).length, known: wk.senses.filter(isKnown).length });

/* ---------- Moons ---------- */
function moonPath(frac) {
  const r = 20;
  const k = 0.12 + 0.88 * Math.max(0, Math.min(1, frac));   /* lit fraction of the disk */
  const rx = (r * Math.abs(1 - 2 * k)).toFixed(2);
  const sweep = k > 0.5 ? 1 : 0;                            /* terminator bulges left (gibbous) or right (crescent) */
  return `M0,-${r} A${r},${r} 0 0 1 0,${r} A${rx},${r} 0 0 ${sweep} 0,-${r}Z`;
}
function moonSVG(learned, total) {
  const full = total > 0 && learned === total;
  return `<svg class="moon${full ? " full" : ""}" viewBox="-22 -22 44 44" aria-hidden="true"><circle class="disk" r="20"></circle>${learned ? `<path class="lit" d="${moonPath(learned / total)}"></path>` : ""}</svg>`;
}
function updateHeaderMoon() {
  const cw = currentWeek();
  const ids = WEEKS.slice(0, cw).flatMap((w) => w.senses);
  const n = ids.filter(isLearned).length;
  $("#moon-lit").setAttribute("d", n ? moonPath(n / ids.length) : "");
  $("#moon").classList.toggle("full", ids.length > 0 && n === ids.length);
  $("#moon-caption").textContent = t("capOverall", cw, n, ids.length);
}

/* ---------- Home: week list ---------- */
function show(view) {
  for (const v of ["home", "practice", "pquiz"]) $("#view-" + v).hidden = v !== view;
  window.scrollTo(0, 0);
}

  updateHeaderMoon();

  $("#weeks").innerHTML = WEEKS.map((wk) => {
    const s = weekStats(wk), later = wk.n > cw;
    return `<div class="wk${wk.n === cw ? " current" : ""}${later ? " later" : ""}" id="wk-${wk.n}">
      <div class="info">${moonSVG(s.learned, s.total)}<div style="min-width:0">
        <div class="title">${esc(t("week", wk.n))}${wk.n === cw ? `<span class="badge">${esc(t("thisWeek"))}</span>` : ""}${later ? `<span class="badge later">${esc(t("laterBadge"))}</span>` : ""}${s.missed ? `<span class="badge miss">${esc(t("missed", s.missed))}</span>` : ""}</div>
        <div class="muted small">${esc(t("weekLine", wk.range, s.learned, s.total, s.known))}</div></div></div>
      <div class="btns">

        <button class="btn secondary" type="button" data-act="quiz" data-w="${wk.n}">${esc(t("pquiz"))}<small>${esc(t("pquizSub", wk.n))}</small></button>
      </div></div>`;
  }).join("");
}
let pendingAction = null;
$("#weeks").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const w = +b.dataset.w, act = b.dataset.act;
  const run = () => (act === "study" ? startPractice(w) : startPracticeQuiz(w));
  /* A week the schedule has not opened yet: advise once per week, then let the student go ahead */
  const warned = new Set(JSON.parse(store.get("crescent.warned") || "[]"));
  if (w > currentWeek() && !warned.has(w)) {
    pendingAction = () => { warned.add(w); store.set("crescent.warned", JSON.stringify([...warned])); run(); };
    $("#later-dialog").hidden = false; return;
  }

});

/* ---------- Practice: 12 meanings, lowest levels first ---------- */
const prac = { queue: [], total: 0, shown: 0, firstTry: 0, dropped: new Set(), current: null, state: "idle", timer: null, week: 1, free: false };

function startPractice(w) {
  const wk = WEEKS[w - 1];
  const units = [];
  wk.heads.forEach((h) => h.senses.forEach((s) => { if (!(SKIP_KNOWN && isKnown(s.id))) units.push({ lemma: h.lemma, sense: s }); }));
  prac.week = w; prac.free = false;
  show("practice");
  if (!units.length) { $("#p-run").hidden = true; $("#p-done").hidden = true; $("#p-empty").hidden = false; return; }
  /* lowest level first; random order within a level */
  runPractice(shuffle(units).sort((a, b) => level(a.sense.id) - level(b.sense.id)).slice(0, SESSION_SIZE));
}
/* Free review: all of the week's meanings (known ones included) in random order. Nothing is recorded:
   levels, the known list, review badges and moons do not change. Offered only when a week is finished. */
function startFreeReview(w) {
  const units = [];
  WEEKS[w - 1].heads.forEach((h) => h.senses.forEach((s) => units.push({ lemma: h.lemma, sense: s })));
  prac.week = w; prac.free = true;
  show("practice");
  runPractice(shuffle(units).slice(0, SESSION_SIZE));
}
function runPractice(chosen) {
  $("#p-empty").hidden = true;
  $("#p-free").hidden = !prac.free;
  prac.queue = chosen.map((u) => ({ ...u, used: new Set(), attempts: 0 }));
  prac.total = prac.queue.length; prac.shown = 0; prac.firstTry = 0; prac.dropped = new Set();
  $("#p-done").hidden = true; $("#p-run").hidden = false;
  nextPractice();
}
function nextPractice() {
  clearTimeout(prac.timer);
  if (!prac.queue.length) return finishPractice();
  const u = prac.queue.shift();
  let pool = u.sense.items.filter((it) => !u.used.has(it.id));
  if (!pool.length) pool = u.sense.items.filter((it) => it.id !== u.lastId);
  if (!pool.length) pool = u.sense.items;
  const item = pick(pool);
  u.used.add(item.id); u.lastId = item.id;
  prac.current = { unit: u, item };
  prac.state = "answering";
  if (u.attempts === 0) prac.shown++;
  $("#p-recycle").hidden = u.attempts === 0;
  $("#p-sentence").innerHTML = sentenceHTML(item.s, null, null, hintOf(item.a));
  $("#p-cue").textContent = item.cue;
  const input = $("#p-input");
  input.value = hintOf(item.a); input.readOnly = false;
  $("#p-check").textContent = t("check");
  $("#p-feedback").hidden = true;
  updatePracticeMeta();
  input.focus();
  try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
  startPracticeTimer();
}
function updatePracticeMeta() {
  $("#p-count").textContent = t("pCount", prac.shown, prac.total);
  $("#p-week").textContent = t("week", prac.week);
  $("#p-bar").style.width = (prac.total ? ((prac.shown - (prac.state === "answering" ? 1 : 0)) / prac.total) * 100 : 0) + "%";
}
$("#p-form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (prac.state === "feedback") {
    if (performance.now() - prac.feedbackAt < 600) return;
    return nextPractice();
  }
  if (prac.state !== "answering") return;
  const input = $("#p-input");
  const typed = input.value;
  if (!typed.trim() || norm(typed) === hintOf(prac.current.item.a)) { input.focus(); return; }
  stopPracticeTimer();
  const { unit, item } = prac.current;
  const fb = $("#p-feedback");
  input.readOnly = true;
  if (norm(typed) === norm(item.a)) {
    if (unit.attempts === 0) prac.firstTry++;
    prac.state = "correct";
    const firstEver = !prac.free && unit.attempts === 0 && !prog[unit.sense.id];
    if (prac.free) { /* free review: not recorded */ }
    else if (firstEver && SKIP_KNOWN) markKnown(unit.sense.id); else applyResult(unit.sense.id, true, prac.dropped);
    fb.className = "feedback ok"; fb.hidden = false;
    $("#p-sentence").innerHTML = sentenceHTML(item.s, item.a, "fill-ok");
    fb.innerHTML = `<span>${esc(t(firstEver && SKIP_KNOWN ? "knownNow" : "correct"))}</span>`;
    updatePracticeMeta();
    prac.timer = setTimeout(nextPractice, firstEver && SKIP_KNOWN ? 1800 : 900);
  } else {
    showMiss(unit, item, t("typed", esc(typed.trim())));
  }
});
/* A miss keeps the same item on screen with the answer filled in. The timer is paused, and the next item
   appears only after a deliberate Continue or Enter (presses in the first 0.6 s are ignored).
   The meaning drops one level and comes back once later in the session. */
function showMiss(unit, item, verdict) {
  unit.attempts++;
  if (!prac.free) applyResult(unit.sense.id, false, prac.dropped);
  const comesBack = unit.attempts === 1;
  if (comesBack) prac.queue.splice(Math.min(3, prac.queue.length), 0, unit);
  prac.state = "feedback";
  prac.feedbackAt = performance.now();
  $("#p-sentence").innerHTML = sentenceHTML(item.s, item.a, "fill-ok");
  const fb = $("#p-feedback");
  fb.className = "feedback bad"; fb.hidden = false;
  fb.innerHTML = `<span class="verdict">${verdict}</span><span class="small muted">${esc(t(comesBack ? "missAgain" : "missOnce"))}</span>`;
  $("#p-clock").textContent = t("paused");
  $("#p-clock").classList.remove("low"); $("#p-clock").classList.add("paused");
  $("#p-timerbar").classList.add("paused");
  const btn = $("#p-check");
  btn.textContent = t("cont");
  $("#p-input").blur();
  try { btn.focus({ preventScroll: true }); } catch (e) { btn.focus(); }
  fb.scrollIntoView({ block: "nearest" });
  updatePracticeMeta();
}
/* Ignore Enter presses that only confirm Japanese IME input or auto-repeat. */
$("#p-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.isComposing || e.keyCode === 229 || e.repeat)) e.preventDefault();
});
function startPracticeTimer() {
  prac.start = performance.now();
  $("#p-timerbar").classList.remove("paused");
  $("#p-clock").classList.remove("paused");
  clearInterval(prac.tick);
  tickPractice();
  prac.tick = setInterval(tickPractice, 100);
}
function stopPracticeTimer() { clearInterval(prac.tick); }
function tickPractice() {
  const limit = TIME_LIMIT * 1000;
  const left = Math.max(0, limit - (performance.now() - prac.start));
  $("#p-timer").style.width = (left / limit) * 100 + "%";
  $("#p-clock").innerHTML = Math.ceil(left / 1000) + `<small>${esc(t("sLeft"))}</small>`;
  $("#p-timerbar").classList.toggle("low", left < 3000);
  $("#p-clock").classList.toggle("low", left < 3000);
  if (left <= 0) { stopPracticeTimer(); practiceTimeout(); }
}
/* Time ran out: grade whatever was typed; if nothing was typed, count it as a miss. */
function practiceTimeout() {
  if (prac.state !== "answering") return;
  const input = $("#p-input");
  if (input.value.trim() && norm(input.value) !== hintOf(prac.current.item.a)) { $("#p-form").requestSubmit(); return; }
  const { unit, item } = prac.current;
  input.readOnly = true;
  showMiss(unit, item, esc(t("timeUp")));
}
$("#p-quit").addEventListener("click", finishPractice);
function finishPractice() {
  clearTimeout(prac.timer);
  stopPracticeTimer();
  prac.state = "idle";
  $("#p-run").hidden = true; $("#p-done").hidden = false;
  $("#p-score").textContent = `${prac.firstTry} / ${prac.total}`;
  $("#p-score-note").textContent = t("sessionNote", prac.firstTry, prac.total) + (prac.free ? " · " + t("freeLabel") : "");
  const s = weekStats(WEEKS[prac.week - 1]);
  $("#p-weekmoon").innerHTML = moonSVG(s.learned, s.total) + `<span>${esc(s.known ? t("weekStatusK", prac.week, s.learned, s.total, s.known) : t("weekStatus", prac.week, s.learned, s.total))}</span>`;
}
$("#p-more").addEventListener("click", () => (prac.free ? startFreeReview : startPractice)(prac.week));
$("#p-empty-free").addEventListener("click", () => { $("#free-dialog").hidden = false; });
$("#free-go").addEventListener("click", () => { $("#free-dialog").hidden = true; startFreeReview(prac.week); });
$("#free-back").addEventListener("click", () => { $("#free-dialog").hidden = true; });
$("#p-empty-quiz").addEventListener("click", () => startPracticeQuiz(prac.week));
$("#p-empty-home").addEventListener("click", () => { renderHome(); show("home"); });
$("#p-home").addEventListener("click", () => { renderHome(); show("home"); });

/* ---------- Practice quiz: works like the classroom quiz, on this device only ---------- */
const quiz = { running: false, items: [], i: 0, typed: "", start: 0, tick: null, results: [], week: 1, tries: 0, lastChecked: "" };
/* One item per headword; ~80/20 chosen week / earlier weeks; week 1 uses only its own words; short pools are topped up from the other pool. */
function planQuiz(w) {
  const cur = WEEKS[w - 1].heads, prev = WEEKS.slice(0, w - 1).flatMap((x) => x.heads);
  let nReview = w === 1 ? 0 : Math.round(PQUIZ_SIZE * PQUIZ_REVIEW);
  let nNew = PQUIZ_SIZE - nReview;
  if (nNew > cur.length) { nReview = Math.min(prev.length, nReview + nNew - cur.length); nNew = cur.length; }
  if (nReview > prev.length) { nNew = Math.min(cur.length, nNew + nReview - prev.length); nReview = prev.length; }
  return shuffle([...shuffle(cur).slice(0, nNew), ...shuffle(prev).slice(0, nReview)]);
}
function startPracticeQuiz(w) {
  quiz.items = planQuiz(w).map((h) => { const sense = pick(h.senses); return { lemma: h.lemma, sense, item: pick(sense.items) }; });
  quiz.i = 0; quiz.results = []; quiz.running = true; quiz.week = w;
  $("#q-done").hidden = true; $("#q-run").hidden = false;
  show("pquiz");
  showQuizItem();
}
/* Restricted keyboard: the answer's letters plus distractors, at least 8 keys and at least 3 distractors. */
function keyLetters(answer) {
  const own = [...new Set(answer.toLowerCase().replace(/[^a-z]/g, "").split(""))];
  const target = Math.min(26, Math.max(MIN_KEYS, own.length + MIN_DISTRACTORS));
  const pool = shuffle(DISTRACTOR_POOL.split("").filter((c) => !own.includes(c)))
    .sort((a, b) => DISTRACTOR_POOL.indexOf(a) - DISTRACTOR_POOL.indexOf(b) + (Math.floor(Math.random() * 9) - 4));
  return new Set([...own, ...pool.slice(0, Math.max(0, target - own.length))]);
}
function buildKeyboard(answer) {
  const letters = keyLetters(answer);
  const specials = [...new Set(answer.replace(/[a-zA-Z]/g, "").split(""))];
  const rows = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
  let html = rows.map((r, idx) => `<div class="kbd-row">${r.split("").map((ch) =>
    letters.has(ch) ? `<button class="key" type="button" data-k="${ch}">${ch}</button>`
                    : `<button class="key" type="button" disabled aria-hidden="true" tabindex="-1"></button>`).join("")}
    ${idx === 2 ? '<button class="key wide" type="button" data-k="back" aria-label="Delete">⌫</button>' : ""}</div>`).join("");
  if (specials.length) html += `<div class="kbd-row">${specials.map((c) =>
    `<button class="key wide" type="button" data-k="${esc(c)}">${c === " " ? "space" : esc(c)}</button>`).join("")}</div>`;
  $("#q-kbd").innerHTML = html;
  quiz.allowed = new Set([...letters, ...specials]);
}
function renderDisplay() { $("#q-display").innerHTML = esc(quiz.typed) + '<span class="caret"></span>'; }
function pressKey(k) {
  if (!quiz.running) return;
  $("#q-display").classList.remove("wrong");
  if (k === "back") { if (quiz.typed.length > hintOf(quiz.items[quiz.i].item.a).length) quiz.typed = quiz.typed.slice(0, -1); }
  else if (quiz.allowed.has(k) && quiz.typed.length < 30) quiz.typed += k;
  renderDisplay();
}
$("#q-kbd").addEventListener("pointerdown", (e) => {
  const b = e.target.closest(".key"); if (!b || b.disabled) return;
  e.preventDefault(); pressKey(b.dataset.k);
});
$("#q-kbd").addEventListener("keydown", (e) => {
  const b = e.target.closest(".key");
  if (b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pressKey(b.dataset.k); }
});
document.addEventListener("keydown", (e) => {
  if (!quiz.running || $("#view-pquiz").hidden) return;
  if (e.target.closest && e.target.closest(".key")) return;
  if (e.key === "Backspace") { e.preventDefault(); pressKey("back"); }
  else if (e.key === "Enter") { e.preventDefault(); checkQuizAnswer(); }
  else if (e.key.length === 1) { const k = e.key.toLowerCase(); if (quiz.allowed.has(k)) { e.preventDefault(); pressKey(k); } }
});
$("#q-next").addEventListener("click", () => checkQuizAnswer());

function showQuizItem() {
  const q = quiz.items[quiz.i];
  $("#q-count").textContent = t("qCount", quiz.i + 1, quiz.items.length);
  $("#q-sentence").innerHTML = sentenceHTML(q.item.s, null, null, hintOf(q.item.a));
  $("#q-cue").textContent = q.item.cue;
  $("#q-next").textContent = quiz.i === quiz.items.length - 1 ? t("submit") : t("next");
  $("#q-retry").textContent = "";
  $("#q-display").classList.remove("wrong");
  quiz.typed = hintOf(q.item.a); quiz.tries = 0; quiz.lastChecked = "";
  buildKeyboard(q.item.a); renderDisplay();
  quiz.start = performance.now();
  clearInterval(quiz.tick);
  updateTimer();
  quiz.tick = setInterval(updateTimer, 100);
}
function updateTimer() {
  const limit = TIME_LIMIT * 1000;
  const left = Math.max(0, limit - (performance.now() - quiz.start));
  $("#q-timer").style.width = (left / limit) * 100 + "%";
  $("#q-clock").innerHTML = Math.ceil(left / 1000) + `<small>${esc(t("sLeft"))}</small>`;
  $("#q-timerbar").classList.toggle("low", left < 3000);
  $("#q-clock").classList.toggle("low", left < 3000);
  if (left <= 0) recordQuizItem(true);
}
/* Wrong answers can be retried until time runs out (no extra time); only the given first letter counts as no answer. */
function checkQuizAnswer() {
  if (!quiz.running) return;
  const q = quiz.items[quiz.i], v = quiz.typed.trim();
  if (!v || norm(v) === hintOf(q.item.a)) { nudge(t("enterWord")); return; }
  quiz.tries++; quiz.lastChecked = norm(v);
  if (norm(v) === norm(q.item.a)) recordQuizItem(false);
  else nudge(t("wrongTry"));
}
function nudge(msg) {
  $("#q-retry").textContent = msg;
  const d = $("#q-display"); d.classList.remove("wrong"); void d.offsetWidth; d.classList.add("wrong");
  if (navigator.vibrate) { try { navigator.vibrate(100); } catch (e) {} }
}
function recordQuizItem(timedOut) {
  if (!quiz.running) return;
  clearInterval(quiz.tick);
  const q = quiz.items[quiz.i];
  let resp = quiz.typed.trim();
  if (resp && norm(resp) === hintOf(q.item.a)) resp = "";
  if (timedOut && resp && norm(resp) !== quiz.lastChecked) quiz.tries++;
  quiz.results.push({ q, response: resp, correct: !!resp && norm(resp) === norm(q.item.a), timedOut, tries: quiz.tries });
  quiz.i++;
  if (quiz.i < quiz.items.length) showQuizItem(); else finishQuiz();
}
function finishQuiz() {
  quiz.running = false;
  const r = quiz.results, right = r.filter((x) => x.correct).length;
  /* each answer counts toward its own week, the same as a practice answer */
  r.forEach((x) => applyResult(x.q.sense.id, x.correct, null));
  $("#q-run").hidden = true; $("#q-done").hidden = false;
  $("#q-score").textContent = `${right} / ${r.length}`;
  $("#q-score-note").textContent = t("qNote", t("pquizSub", quiz.week));
  $("#q-review-list").innerHTML = r.map((x) => `<li>
      <span class="mark ${x.correct ? "ok" : "bad"}">${esc(x.correct ? t("resOk") : x.timedOut && !x.response ? t("resNone") : t("resBad"))}</span>
      <span>${sentenceHTML(x.q.item.s, x.q.item.a, x.correct ? "fill-ok" : "fill-bad")}</span>
      <span class="small muted">${esc(x.q.item.cue)}${x.correct ? "" : " · " + esc(t("yourAnswer", x.response ? "“" + x.response + "”" : t("none")))}</span>
    </li>`).join("");
}
$("#q-home").addEventListener("click", () => { renderHome(); show("home"); });

/* ---------- Start ---------- */
applyLang();
show("home");
const cwEl = document.getElementById("wk-" + currentWeek());
if (cwEl && currentWeek() > 1) cwEl.scrollIntoView({ block: "start" });
</script>
